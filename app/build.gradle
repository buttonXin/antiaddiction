plugins {
    id 'com.android.application'
}
android {
    namespace 'com.oldhigh.antiaddiction'
    compileSdk 34

    defaultConfig {
        applicationId "com.oldhigh.autoOperation"
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName "1.1"

        archivesBaseName = "autoOperation-" + defaultConfig.versionName + '-' + (new Date().format("yyyyMMddHHmm"))


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        oldhigh {
            storeFile file('oldhigh.jks')
            storePassword '123456'
            keyAlias 'oldhigh'
            keyPassword '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.oldhigh
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            signingConfig signingConfigs.oldhigh
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'com.github.getActivity:ToastUtils:10.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    //基础库（必须）
    implementation "com.github.ven-coder.Assists:assists-base:v3.2.201"

    implementation 'com.google.code.gson:gson:2.9.0'
}