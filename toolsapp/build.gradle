plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xreal.evapro.toolsapp'
    compileSdk 33

    defaultConfig {
        applicationId "com.oldhigh.toolsapp"
        minSdk 29
        targetSdk 33
        versionCode 24
        versionName "1.7.1"
        archivesBaseName = "toosapp-" + defaultConfig.versionName + '-' + defaultConfig.versionCode + '-' + (new Date().format("yyyy-MMdd-HHmm"))
        buildConfigField 'String', 'impl_info', "\"$defaultConfig.versionName-$defaultConfig.versionCode-${(new Date().format("yyyy-MMdd-HHmm"))}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    signingConfigs {
        mydemo {
            storeFile file('./src/main/assets/myDemo.jks')
            storePassword '123456'
            keyAlias 'mydemo'
            keyPassword '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.mydemo
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.mydemo
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
//    implementation 'androidx.appcompat:appcompat:1.5.1'
//    implementation 'com.google.android.material:material:1.6.1'

//    implementation 'com.android.support:support-v4:28.0.0'

//    implementation 'com.android.support:recyclerview-v7:28.0.0'

    // 嵌入式HTTP服务器
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // 使用m3u8播放
    implementation "com.google.android.exoplayer:exoplayer:2.19.1"

}